name: Validate Version Bump

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  check-version-bump:
    if: contains(github.event.pull_request.labels.*.name, 'publish') || contains(github.event.pull_request.labels.*.name, 'verify')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION file was modified
        run: |
          echo "Checking if VERSION file was modified in this PR..."
          
          # Get base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Check if VERSION file changed
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -q "^VERSION$"; then
            echo "✓ VERSION file was modified"
            
            # Get old and new versions
            git checkout "${BASE_SHA}"
            OLD_VERSION=$(cat VERSION)
            git checkout "${HEAD_SHA}"
            NEW_VERSION=$(cat VERSION)
            
            echo "Version change: ${OLD_VERSION} → ${NEW_VERSION}"
            
            # Validate semantic versioning format
            if ! echo "${NEW_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: VERSION must follow semantic versioning (X.Y.Z)"
              exit 1
            fi
            
            # Ensure version increased
            if [ "${OLD_VERSION}" = "${NEW_VERSION}" ]; then
              echo "ERROR: VERSION must be bumped (currently unchanged: ${NEW_VERSION})"
              exit 1
            fi
            
            echo "✓ Version properly bumped: ${OLD_VERSION} → ${NEW_VERSION}"
          else
            echo "ERROR: VERSION file must be modified when using 'publish' or 'verify' labels"
            echo "Please update the VERSION file to reflect the new release version."
            exit 1
          fi
        shell: bash

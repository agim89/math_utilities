name: Verify Integration Tests

on:
  pull_request:
    types: [labeled]

jobs:
  verify:
    if: github.event.label.name == 'verify' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  consumer-integration:
    needs: verify
    if: github.event.label.name == 'verify'
    uses: agim89/shared-workflows/.github/workflows/consumer-verify.yml@main
    with:
      version: ${{ needs.verify.outputs.version }}-dev-
      remote: conan-rc
      git_sha: ${{ needs.verify.outputs.short_sha }}
    secrets: inherit

name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to protect'
        required: true
        default: 'main'

jobs:
  setup-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Configure branch protection rules
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ inputs.branch }}"
          
          echo "Configuring branch protection for ${REPO}:${BRANCH}"
          
          # Define protection rules with required checks
          gh api repos/${REPO}/branches/${BRANCH}/protection \
            --method PUT \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "checks": [
                {"context": "Build and Test (ubuntu-latest)"},
                {"context": "Build and Test (macos-latest)"},
                {"context": "Build and Test (windows-latest)"}
              ]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          EOF
          
          echo "✓ Branch protection configured successfully"
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Verify branch protection
        run: |
          echo "Verifying protection rules..."
          gh api repos/${{ github.repository }}/branches/${{ inputs.branch }}/protection \
            --jq '{strict_checks: .required_status_checks.strict, required_checks: .required_status_checks.checks, enforce_admins: .enforce_admins, allow_force_pushes: .allow_force_pushes, required_reviews: .required_pull_request_reviews.required_approving_review_count}'
          echo "✓ Protection rules verified"
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

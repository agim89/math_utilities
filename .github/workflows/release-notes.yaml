name: Release Notes

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release-notes-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Configure git auth for push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin "https://x-access-token:${{ secrets.BRANCH_PROTECTION_TOKEN }}@github.com/${{ github.repository }}.git"
        shell: bash

      - name: Create release notes file
        run: |
          set -e
          
          # Exit if no unreleased changes
          if [ ! -s "Release-Notes/unreleased.md" ]; then
            echo "No unreleased changes to document. Skipping."
            exit 0
          fi

          # Get current version from VERSION file
          VERSION=$(cat VERSION)
          RELEASE_FILE="Release-Notes/Release-$VERSION.md"
          
          echo "Creating release notes for version $VERSION: $RELEASE_FILE"
          
          {
            echo "# Release $VERSION"
            echo ""
            cat Release-Notes/unreleased.md
          } > "$RELEASE_FILE"

          # Clear unreleased notes
          > Release-Notes/unreleased.md

          # Commit and push
          git add "$RELEASE_FILE" Release-Notes/unreleased.md
          git commit -m "docs: Add release notes for $VERSION"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        shell: bash
name: Final Release

on:
  push:
    branches: [main]

jobs:
  # Only trigger if the merged PR had the 'publish' label
  check-publish-label:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR and check for publish label
        id: check
        run: |
          # Get the commit message of the merge commit
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Extract PR number from commit message (GitHub creates: "Merge pull request #123 from...")
          # OR check HEAD~1..HEAD for PR info in case of local merge
          if [[ $COMMIT_MSG =~ Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            echo "Merged PR: #${PR_NUMBER}"
            
            # Check if PR had 'publish' label
            LABELS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              | jq -r '.labels[].name')
            
            if echo "$LABELS" | grep -q "publish"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          else
            # Fallback: check if current branch/commit has publish label by looking at previous tags or releases
            # For now, assume any push to main with version change should release
            # Check if VERSION file changed in last commit
            if git diff HEAD~1 HEAD --name-only | grep -q "^VERSION$"; then
              echo "VERSION file changed, assuming publish intent"
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

  create-release:
    needs: [check-publish-label, get-version]
    if: needs.check-publish-label.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
    uses: agim89/shared-workflows/.github/workflows/release.yml@main
    with:
      version: ${{ needs.get-version.outputs.version }}
    secrets: inherit
